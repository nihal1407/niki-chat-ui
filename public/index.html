<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Niki Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-view" class="login-wrap hidden">
    <div class="login-card">
      <h1>💬 Niki</h1>
      <p class="sub">Private chat interface</p>
      <input type="password" id="pwd" placeholder="Password" autocomplete="current-password">
      <button id="login-btn">Enter</button>
      <div id="login-err" class="err"></div>
    </div>
  </div>

  <div id="chat-view" class="chat-wrap hidden">
    <header>
      <span class="dot"></span> Niki <span class="tag">hermes agent</span>
    </header>
    <main id="messages"></main>
    <footer>
      <textarea id="input" rows="1" placeholder="Message Niki…"></textarea>
      <button id="send">➤</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
